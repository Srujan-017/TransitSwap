name: CI

# Phase 10 — PROJECT_MASTER_PLAN.md §39: "CI running typecheck + build + test
# on both packages." Backend and frontend run as independent jobs so a
# failure in one doesn't hide the other's result. The E2E job is separate
# and non-blocking (see its own comment) — it depends on live Nominatim/OSRM
# reachability, which this CI gate should never depend on to go green.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    name: Backend (typecheck, build, test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Build
        run: npm run build
      # Includes the Phase 10 supertest API integration tests, run against a
      # real in-memory MongoDB started by scripts/run-tests.js itself.
      - name: Test
        run: npm test

  frontend:
    name: Frontend (typecheck, build, component tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Typecheck + build
        run: npm run build
      - name: Component tests (Vitest + Testing Library)
        run: npx vitest run

  e2e:
    name: E2E happy path (non-blocking)
    # Deliberately does not run on every push/PR: it needs real outbound
    # network access to Nominatim (geocoding) and starts both dev servers
    # plus an in-memory MongoDB, making it slower and more exposed to
    # third-party rate limiting than this project wants as a merge gate.
    # Available on demand via "Run workflow" in the Actions tab.
    if: github.event_name == 'workflow_dispatch'
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm --prefix backend ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test

  smoke-test:
    name: Post-deploy smoke test (non-blocking)
    # Phase 13 — PROJECT_MASTER_PLAN.md §39: "a post-deploy smoke test in CI."
    # Read-only checks against the LIVE deployed URLs, never the local dev
    # servers the other jobs use. Skips cleanly (rather than failing) until
    # vars.DEPLOYED_BACKEND_URL is set as a repository/environment Actions
    # variable (Settings → Secrets and variables → Actions → Variables) —
    # these are plain URLs, not secrets, so they belong in vars, not secrets.
    # Runs after every push to main once deployed, plus on-demand.
    needs: [backend, frontend]
    if: vars.DEPLOYED_BACKEND_URL != ''
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - name: GET /api/health on the deployed backend
        run: |
          res="$(curl -sS -w '\n%{http_code}' "${{ vars.DEPLOYED_BACKEND_URL }}/api/health")"
          body="$(echo "$res" | head -n -1)"
          status="$(echo "$res" | tail -n 1)"
          echo "$body"
          if [ "$status" != "200" ]; then
            echo "::error::Expected 200 from /api/health, got $status"
            exit 1
          fi
          connected="$(echo "$body" | node -e 'let d="";process.stdin.on("data",c=>d+=c);process.stdin.on("end",()=>{try{console.log(JSON.parse(d).data?.database)}catch{console.log("parse-error")}})')"
          echo "database connectivity: $connected"
          # PROJECT_MASTER_PLAN.md §39 Phase 13 success criterion: "/api/health
          # returns database: 'connected'". A hard failure here (the whole job
          # stays non-blocking via continue-on-error above) rather than a
          # warning, so an un-configured MONGODB_URI or Atlas network-access
          # list is never silently missed in a green CI run.
          if [ "$connected" != "connected" ]; then
            echo "::error::Deployed backend's /api/health reports database='$connected', not 'connected' — check MONGODB_URI and MongoDB Atlas network access."
            exit 1
          fi
      - name: GET the deployed frontend
        if: vars.DEPLOYED_FRONTEND_URL != ''
        run: |
          status="$(curl -sS -o /dev/null -w '%{http_code}' "${{ vars.DEPLOYED_FRONTEND_URL }}")"
          echo "frontend status: $status"
          if [ "$status" != "200" ]; then
            echo "::error::Expected 200 from the deployed frontend, got $status"
            exit 1
          fi
