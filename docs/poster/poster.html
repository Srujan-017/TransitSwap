<!-- 5 · Problem statement -->
<section class="panel" data-id="problem">
  <h2>Problem Statement</h2>
  <p>Journey planners such as Google Maps optimise travel time and treat accessibility, at best, as a single flag or a weighted
  preference. A rider who cannot climb stairs &mdash; a wheelchair user, a senior citizen, a parent with a stroller &mdash; can still be
  shown a journey that is physically impossible for them, and when no usable route exists the planner silently returns an
  unusable one. Bengaluru commuters, who mix metro, BMTC buses, autos and walking every day, also need to know about crowding,
  weather and missed connections before they set off.</p>
</section>

<!-- 6 · Objectives -->
<section class="panel" data-id="objectives">
  <h2>Objectives</h2>
  <ul>
    <li>Plan journeys that combine metro, bus, auto-rickshaw and walking.</li>
    <li>Enforce accessibility as hard rules for 7 mobility profiles, never as a soft score.</li>
    <li>Explain every recommendation, and every excluded route, in plain language.</li>
    <li>Personalise the ranking from each rider's own choices (TransitDNA learning).</li>
    <li>Predict arrival intervals and missed-connection risk, aware of weather and crowds.</li>
    <li>Guide the trip live with voice turn-by-turn navigation and automatic rerouting.</li>
  </ul>
</section>

<!-- 7 · Methodology -->
<section class="panel" data-id="method">
  <h2>Methodology</h2>
  <ul>
    <li><b>Data:</b> synthetic Bengaluru network &mdash; 3 metro lines (41 stations), 10 bus routes (24 stops), 65 accessibility
      records, 16 crowd readings; live weather; street paths from OpenStreetMap.</li>
    <li><b>Candidate search:</b> bounded graph search (&le; 6 hops, &le; 3 transfers) over all four modes; Pareto filter on time,
      fare, walking and transfers.</li>
    <li><b>Hard constraints first:</b> lift, ramp and step-free rules, a 1.2 km walking cap and a peak-crowd rule remove unusable
      routes <i>before</i> ranking; each exclusion gets a typed reason; missing data is a warning, never an assumption.</li>
    <li><b>Ranking:</b> 9 normalised features, profile weights and TransitDNA personalisation.</li>
    <li><b>Reliability:</b> 90 % / 95 % arrival intervals; Monte Carlo connection risk (500 trials).</li>
    <li><b>Evaluation:</b> 520 origin&ndash;destination pairs &times; 7 profiles at 08:30 and 14:30, against shortest-time and
      soft-scoring planners.</li>
    <li><b>Stack:</b> React 19, TypeScript, Node.js / Express, MongoDB, Leaflet; Vercel + Render.</li>
  </ul>

<!-- 13 · Conclusion -->
<section class="panel" data-id="conclusion">
  <h2>Conclusion</h2>
  <div class="concl grow">
    <p>TransitSwap separates feasibility from preference: routes a rider cannot use are removed before ranking, every exclusion
    explains itself, and the rest are ranked and personalised. On 520 simulated trips it never recommended an unusable route.
    Future work: real GTFS and surveyed station data, live lift-outage feeds, a user study with disability organisations,
    Kannada / Hindi support and a mobile app.</p>
